<!DOCTYPE html>
<html lang="en">
<head>
    <title>LifeOS</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
    <link rel="stylesheet" href="index.nginx-debian.css">

    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
</head>

<!---------------------------------------
              HTML BODY
----------------------------------------->
<body>
    <div id="container">
        <nav class="top-nav">
            <div class="nav-brand">
                LifeOS
            </div>
    
            <div class="nav-tabs">
                <button class="nav-tab active" data-page="chat">Chat</button>
                <button class="nav-tab" data-page="email">Email</button>
                <button class="nav-tab" data-page="calendar">Calendar</button>
                <button class="nav-tab" data-page="tasks">Tasks</button>
            </div>
    
            <div class="nav-actions">
                <button class="nav-tab" data-page="settings">⚙</button>
            </div>
        </nav>
        <div id="chatbox"></div>
        <input type="file" id="imageInput" accept="image/*" hidden />
        <div id="imagePreview"></div>
        <div id="responsebox">
            <button id="addImageButton" title="Click here to add an image to the context">+</button>
            <textarea
            id="userInput"
            type="text"
            placeholder="Type a message..."></textarea>
            
            <div>
                <button id="sendButton">
                    Send
                </button>
                <p id="tokenCount" style="font-size: 14px; margin: 2px; margin-left: 16px;">Token count: 0</p>
            </div>
        </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/16.2.1/lib/marked.umd.min.js"></script>
    <script src="./index.nginx-debian.js"></script>
</body>
</html>
