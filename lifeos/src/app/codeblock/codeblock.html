<div class="code-container">
    <div class="code-header">
        <span class="code-language">{{ language || 'code' }}</span>

        <button
            type="button"
            class="copy-button"
            (click)="copyCode()">
            {{ copyButtonText }}
        </button>
    </div>

    <pre><code #codeElement [class]="'language-' + language">{{ code }}</code></pre>
</div>
